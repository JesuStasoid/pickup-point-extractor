# Builds both apps, then publishes GitHub Release "Pick-up point extractor v1.0"
# with exactly six assets. Tag pushes of v1.0 and workflow_dispatch both do this.
# Publishing lives here so build.yml cannot attach a different set.
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.0"

permissions:
  contents: write
  actions: write

concurrency:
  group: release-v1.0
  cancel-in-progress: false

jobs:
  build:
    name: Build apps
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: "Pick-up_point_extractor_v1.0.*"
          path: dist
          merge-multiple: true

      - name: Publish the six release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export LC_ALL=C

          tag="v1.0"
          title="Pick-up point extractor v1.0"
          stage="${RUNNER_TEMP}/release-assets"
          notes="${RUNNER_TEMP}/release-notes.md"
          mkdir -p "$stage"

          exe_name="Pick-up_point_extractor_v1.0.exe"
          dmg_name="Pick-up_point_extractor_v1.0.dmg"
          cp "dist/${exe_name}" "$stage/"
          cp "dist/${dmg_name}" "$stage/"
          cp "vectorworks/PlaceArrayCalcHoistsV3.py" "$stage/"
          cp "vectorworks/Sound_Hoist_Class.vwx" "$stage/"
          cp "autocad/PlaceArrayCalcHoists.lsp" "$stage/"
          cp "autocad/HoistPoint.dwg" "$stage/"

          assets=(
            "$stage/${exe_name}"
            "$stage/${dmg_name}"
            "$stage/PlaceArrayCalcHoistsV3.py"
            "$stage/Sound_Hoist_Class.vwx"
            "$stage/PlaceArrayCalcHoists.lsp"
            "$stage/HoistPoint.dwg"
          )
          app_assets=(
            "$stage/${exe_name}"
            "$stage/${dmg_name}"
          )
          if [[ ${#assets[@]} -ne 6 ]]; then
            echo "internal error: asset list is not 6" >&2
            exit 1
          fi
          for f in "${assets[@]}"; do
            if [[ ! -f "$f" ]]; then
              echo "missing staged asset: $f" >&2
              ls -lR dist "$stage" >&2 || true
              exit 1
            fi
          done
          # The standalone extractor sources stay in the repo. They are not release files.
          if find "$stage" -type f \( -name 'extract_*.py' -o -name 'app.py' -o -name 'core.py' \) | grep -q .; then
            echo "standalone extractor scripts must not be release assets" >&2
            exit 1
          fi
          find "$stage" -type f -printf '%f\n' | sort > "${RUNNER_TEMP}/staged.txt"
          cat > "${RUNNER_TEMP}/expected.txt" <<'EOF'
          HoistPoint.dwg
          Pick-up_point_extractor_v1.0.dmg
          Pick-up_point_extractor_v1.0.exe
          PlaceArrayCalcHoists.lsp
          PlaceArrayCalcHoistsV3.py
          Sound_Hoist_Class.vwx
          EOF
          if ! cmp -s "${RUNNER_TEMP}/staged.txt" "${RUNNER_TEMP}/expected.txt"; then
            echo "staged files are not the six release assets" >&2
            diff -u "${RUNNER_TEMP}/expected.txt" "${RUNNER_TEMP}/staged.txt" >&2 || true
            exit 1
          fi

          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          cat > "$notes" <<EOF
          Pick-up point extractor v1.0 reads an ArrayCalc project or a Soundvision report and writes a hoist CSV. The Vectorworks 2026 and AutoCAD placement files are attached here too.

          Manuals: [English (MANUAL_EN.md)](${repo_url}/blob/${tag}/MANUAL_EN.md) · [Russian (MANUAL_RU.md)](${repo_url}/blob/${tag}/MANUAL_RU.md)

          Video: https://www.youtube.com/watch?v=_y_PgrNg_jc
          EOF

          # Underscores stay in the download name. The label is the same string.
          label_of() {
            local f
            for f in "$@"; do
              printf '%s#%s\n' "$f" "$(basename "$f")"
            done
          }
          mapfile -t labeled_all < <(label_of "${assets[@]}")
          mapfile -t labeled_apps < <(label_of "${app_assets[@]}")

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file "$notes"
            # Remember the four placement assets. Only the exe and dmg are replaced.
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq '.assets[] | select((.name | endswith(".exe") or endswith(".dmg")) | not) | "\(.id) \(.name)"' \
              | sort > "${RUNNER_TEMP}/kept-before.txt"
            mapfile -t doomed < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq '.assets[] | select(.name | endswith(".exe") or endswith(".dmg")) | .name')
            for name in "${doomed[@]}"; do
              gh release delete-asset "$tag" "$name" --yes
            done
            gh release upload "$tag" "${labeled_apps[@]}"
          elif [[ "${GITHUB_REF}" == "refs/tags/${tag}" ]]; then
            gh release create "$tag" "${labeled_all[@]}" \
              --title "$title" \
              --notes-file "$notes" \
              --verify-tag
          else
            gh release create "$tag" "${labeled_all[@]}" \
              --title "$title" \
              --notes-file "$notes" \
              --target "${GITHUB_SHA}"
          fi

          if [[ -f "${RUNNER_TEMP}/kept-before.txt" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
              --jq '.assets[] | select((.name | endswith(".exe") or endswith(".dmg")) | not) | "\(.id) \(.name)"' \
              | sort > "${RUNNER_TEMP}/kept-after.txt"
            if ! cmp -s "${RUNNER_TEMP}/kept-before.txt" "${RUNNER_TEMP}/kept-after.txt"; then
              echo "placement assets were replaced; they must stay untouched" >&2
              diff -u "${RUNNER_TEMP}/kept-before.txt" "${RUNNER_TEMP}/kept-after.txt" >&2 || true
              exit 1
            fi
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" > "${RUNNER_TEMP}/release.json"
          python3 - "${RUNNER_TEMP}/release.json" "$title" <<'PY'
          import json, sys
          rel = json.load(open(sys.argv[1]))
          title = sys.argv[2]
          expected = [
              "HoistPoint.dwg",
              "Pick-up_point_extractor_v1.0.dmg",
              "Pick-up_point_extractor_v1.0.exe",
              "PlaceArrayCalcHoists.lsp",
              "PlaceArrayCalcHoistsV3.py",
              "Sound_Hoist_Class.vwx",
          ]
          if rel.get("name") != title:
              raise SystemExit(f"release title is {rel.get('name')!r}, expected {title!r}")
          assets = rel.get("assets") or []
          if len(assets) != 6:
              raise SystemExit(f"expected 6 assets, found {len(assets)}: {assets}")
          names = sorted(a.get("name") or "" for a in assets)
          labels = sorted(a.get("label") or "" for a in assets)
          if names != expected:
              raise SystemExit("download names are not the six filenames:\n" + "\n".join(names))
          if labels != expected:
              raise SystemExit("labels are not the six filenames:\n" + "\n".join(labels))
          forbidden = ("extract_arraycalc_hoists.py", "extract_soundvision_hoists.py", "app.py", "core.py")
          for asset in assets:
              for field in ("name", "label"):
                  value = asset.get(field) or ""
                  if value in forbidden or value.startswith("extract_"):
                      raise SystemExit(f"extractor script published as {field}={value}")
          print(json.dumps({
              "name": rel["name"],
              "tag": rel["tag_name"],
              "url": rel["html_url"],
              "assets": [
                  {"name": a["name"], "label": a.get("label") or ""}
                  for a in assets
              ],
          }, indent=2))
          PY
          url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["html_url"])' "${RUNNER_TEMP}/release.json")"
          echo "Release: ${url}" >> "$GITHUB_STEP_SUMMARY"
